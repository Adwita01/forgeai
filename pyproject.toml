[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI - an autonomous factory that builds, tests and repairs grounded agents on small local models"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pypdf>=4.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
demo = ["reportlab>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
forge = "forgeai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
